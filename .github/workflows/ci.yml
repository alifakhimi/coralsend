name: verify-and-publish

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - run: go test -race ./...
        working-directory: apps/server
      - run: go vet ./...
        working-directory: apps/server

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/app/package-lock.json
      - run: npm ci
        working-directory: apps/app
      - run: npm test
        working-directory: apps/app
      - run: npm run lint
        working-directory: apps/app
      - run: npm run typecheck
        working-directory: apps/app
      - run: npm run build
        working-directory: apps/app

  e2e:
    runs-on: ubuntu-latest
    needs: [server, app]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/app/package-lock.json
      - run: npm ci
        working-directory: apps/app
      - run: npx playwright install --with-deps chromium
        working-directory: apps/app
      - run: npm run test:e2e
        working-directory: apps/app

  docker:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [server, app, e2e]
    strategy:
      matrix:
        include:
          - image_name: coralsend-server
            dockerfile: deploy/Dockerfile.server
          - image_name: coralsend-app
            dockerfile: deploy/Dockerfile.app
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image_name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
